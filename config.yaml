# video2listener 配置文件
# API keys 等敏感信息通过环境变量注入，不写在此文件中

network:
  proxy: http://127.0.0.1:7892   # HTTP/SOCKS5 代理，供 yt-dlp 访问 YouTube

app:
  name: video2listener
  data_dir: ./data
  db_path: ./db/tasks.db
  log_level: INFO

processing:
  default_mode: podcast        # podcast | faithful | condensed
  max_video_duration_minutes: 240
  chunk_minutes: 8             # whisper 转写切分粒度
  retry_times: 3
  retry_backoff_base: 2        # 指数退避基数（秒）

translation:
  max_concurrency: 10          # 最大并发 API 调用数
  rate_limit_rpm: 120          # token-bucket 速率限制（每分钟）
  faithful_max_words: 500      # 忠实翻译初始片段上限，避免输出截断
  audit_max_words: 250         # 单次语义审计英文词数上限
  audit_max_tokens: 512        # 审计仅返回精简 JSON；截断时拆小而非原样重试

# --- 以下 credentials 通过环境变量覆盖 ---
# VIDEO2LISTENER_DEEPSEEK_API_KEY
# VIDEO2LISTENER_DEEPSEEK_BASE_URL
# VIDEO2LISTENER_FISH_API_KEY     (Fish Audio TTS)
# VIDEO2LISTENER_MIMI_API_KEY     (如 Mimi TTS 需要)
llm:
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0.3
  max_tokens: 8192
  translator_role: |
    你是一位资深的 AI/科技领域中文内容创作者。你的翻译需要准确、自然，适合中文听众收听。

    翻译准则：
    - AI 领域专有名词（如 Transformer、RAG、LoRA、RLHF、Attention 等）首次出现时保留英文原文并括号标注中文释义，后续可直接使用中文简称
    - 人名保留英文原名，首次出现时标注中文译名（如 "Sam Altman（萨姆·奥尔特曼）"）
    - 技术缩写（如 GPU、API、SFT、LLM、RL、ML）绝对不要翻译，保持英文原样
    - 避免歧义：遇到可能有多种译法的术语，优先使用业界最通用的译法；如果拿不准，同时保留英文原文
    - 公司名、产品名、论文名保留英文原名
    - 会影响核心结论或理解的数字、百分比、日期等关键信息必须准确保留；非关键细节可自然概括

asr:
  provider: whisper            # whisper | faster-whisper
  model: large-v3-turbo
  model_path: ~/.cache/whisper/large-v3-turbo.pt
  device: cpu
  compute_type: int8

tts:
  provider: fish              # fish | edge | mimi | openai
  base_url: https://api.fish.audio/v1
  model: s2.1-pro-free
  voice: 7f92f8afb8ec43bf81429cc1c9199cb1
  speed: 1.0                  # 语速倍率 (0.5 ~ 2.0)
  rate: 1.0
  output_format: mp3
  concurrency: 3              # TTS 并发请求数
  max_chars: 200              # 相邻短句合并后的单次请求字符上限

web:
  port: 8080

audio:
  bitrate: 128k
  sample_rate: 44100
  channels: 1
  max_output_minutes: 60        # 单集输出上限，超出拆分为多集
