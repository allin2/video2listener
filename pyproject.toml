[project]
name = "video2listener"
version = "0.1.0"
description = "英文 YouTube 播客转中文 MP3 个人工具"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "yt-dlp>=2026.6.9",
    "faster-whisper>=1.0",
    "openai>=1.30",
    "ffmpeg-python>=0.2",
    "edge-tts>=7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
